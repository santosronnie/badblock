# Só para o fork santosronnie/badblock: roda os testes de integração do
# collector-rdns (tarefas 012 e 013) num runner do GitHub, que já tem Docker
# (testcontainers sobe o PG18 e o Valkey). Não faz parte do projeto original.
name: rdns-integracao

on:
  workflow_dispatch:
  push:
    branches: [ci-fork-testes-integracao]

permissions:
  contents: read

jobs:
  integracao:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOFLAGS: -mod=vendor
      GOPROXY: "off"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: false
      - name: Testes unitários
        working-directory: apps/rdns/collector
        run: go test -count=1 ./...
      - name: Testes de integração (Docker via testcontainers)
        working-directory: apps/rdns/collector
        run: go test -race -count=1 -tags integration -v ./internal/store ./internal/live
